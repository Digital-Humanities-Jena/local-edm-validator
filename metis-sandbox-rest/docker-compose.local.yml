services:
  postgres:
    image: postgres:17-alpine
    container_name: metis-sandbox-postgres
    environment:
      POSTGRES_DB: metis-sandbox
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d metis-sandbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:6.0.12
    container_name: metis-sandbox-mongo
    environment:
      MONGO_INITDB_DATABASE: metis-sandbox
      MONGO_INITDB_ROOT_USERNAME: local
      MONGO_INITDB_ROOT_PASSWORD: local
    ports:
      - "37017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  solr:
    build:
      context: ./docker/solr
      dockerfile: Dockerfile
    container_name: metis-sandbox-solr
    ports:
      - "18983:8983"
      - "19983:9983"
    entrypoint:
      - docker-entrypoint.sh
      - solr
      - start
      - -c
      - -f
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/admin/collections?action=LIST | grep -q metis_sandbox_publish_local"]
      interval: 10s
      timeout: 10s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: metis-sandbox-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: localpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    container_name: metis-sandbox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://metis-sandbox-minio:9000 local localpassword
        mc mb --ignore-existing local/metis-sandbox-bucket

  metis-sandbox-local:
    build:
      context: ..
      dockerfile: metis-sandbox-rest/Dockerfile.local
    image: metis-sandbox:local
    container_name: metis-sandbox-local
    ports:
      - "18080:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.yml
      JDK_JAVA_OPTIONS: -Xms500m -Xmx1g
    volumes:
      - ./docker/local/application.yml:/config/application.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      solr:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  minio-data:
